name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: lifehub-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # -------- BACKEND --------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Test and publish Backend
      run: |
        dotnet test Backend.Tests/LifeHub.Backend.Tests.csproj -c Release
        dotnet publish Backend/LifeHub-Backend.csproj -c Release -o publish/backend

    - name: Build migration bundle
      run: |
        dotnet tool install --global dotnet-ef --version 10.0.2
        dotnet restore Backend/LifeHub-Backend.csproj --runtime linux-x64
        dotnet ef migrations bundle --project Backend/LifeHub-Backend.csproj --runtime linux-x64 --configuration Release --output publish/migrate

    # -------- FRONTEND --------
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Frontend
      run: |
        npm ci --prefix Frontend
        npm test --prefix Frontend
        npm run build --prefix Frontend

        mkdir -p publish/frontend
        cp -r Frontend/dist/* publish/frontend/

    # -------- DEPLOY --------
    - name: Upload artifacts
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        source: "publish"
        target: "/home/${{ secrets.VPS_USER }}"

    - name: Deploy via rsync
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        script: |
          set -eu
          mkdir -p /var/www/lifehub/backend /var/www/lifehub/frontend /var/www/lifehub/database/backups

          # SQLite's online backup includes committed WAL changes while the app runs.
          python3 - <<'PY'
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path
          db = Path('/var/www/lifehub/database/lifehub.db')
          if db.is_file():
              backup = db.parent / 'backups' / ('before-deploy-' + datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S') + '.db')
              with sqlite3.connect(db) as source, sqlite3.connect(backup) as target:
                  source.backup(target)
          PY

          chmod +x ~/publish/migrate
          ~/publish/migrate --connection 'Data Source=/var/www/lifehub/database/lifehub.db'

          rsync -av --delete --exclude=.env ~/publish/backend/ /var/www/lifehub/backend/
          rsync -av --delete ~/publish/frontend/ /var/www/lifehub/frontend/

    - name: Update .env file on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        script: |
          echo "Jwt__Key=${{ secrets.JWT_KEY }}" > /var/www/lifehub/backend/.env
          echo "Ai__ApiKey=${{ secrets.AI_API_KEY }}" >> /var/www/lifehub/backend/.env

    - name: Restart backend
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        script: |
          set -eu
          sudo systemctl restart lifehub-backend
          sleep 3
          sudo systemctl is-active --quiet lifehub-backend
